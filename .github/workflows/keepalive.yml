name: Supabase keep-alive

# Free Supabase projects pause after ~7 days without database activity. This
# workflow runs a tiny read query on a schedule so the project stays awake.
# Scheduled runs always use the default branch, so this file must live on main.

on:
  schedule:
    # Mondays and Thursdays at 06:00 UTC — max gap ~3-4 days, well under the
    # ~7-day pause window (GitHub may delay scheduled runs under load).
    - cron: '0 6 * * 1,4'
  # Lets you run it on demand from the Actions tab.
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase to register activity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY repo secret." >&2
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/dishes?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase responded with HTTP $code"
          if [ "$code" != "200" ]; then
            echo "Unexpected status $code — failing so the pause risk is visible." >&2
            exit 1
          fi
          echo "Keep-alive query OK."
